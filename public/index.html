<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Employee Setup — Saint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1019;
    --surface: #1a1a2e;
    --border: #2a2a45;
    --border-focus: #3e3e60;
    --text: #f0ede8;
    --text-mid: #9a96a6;
    --text-dim: #6a6578;
    --accent: #feca57;
    --accent-dim: rgba(254, 202, 87, 0.12);
    --error: #f56363;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
  }

  ::selection {
    color: #1a1a2e;
    background: rgba(254, 202, 87, 0.4);
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .container {
    width: 100%;
    max-width: 480px;
  }

  .header {
    margin-bottom: 2rem;
    text-align: center;
  }

  .header h1 {
    font-weight: 600;
    font-size: 1.75rem;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
  }

  .header h1 .highlight {
    color: var(--accent);
  }

  .header p {
    font-size: 0.875rem;
    color: var(--text-dim);
  }

  /* Stepper */
  .stepper {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2.5rem;
    overflow-x: auto;
    padding-bottom: 0.25rem;
  }

  .stepper-step {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .stepper-dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 500;
    color: var(--text-dim);
    position: relative;
    cursor: default;
    transition: all 0.2s;
  }

  .stepper-dot .stepper-tooltip {
    position: absolute;
    top: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.6rem;
    color: var(--text-dim);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
  }

  .stepper-dot:hover .stepper-tooltip {
    opacity: 1;
  }

  .stepper-step.active .stepper-dot {
    border-color: var(--accent);
    background: var(--accent);
    color: #1a1a2e;
    font-weight: 600;
  }

  .stepper-step.completed .stepper-dot {
    border-color: var(--accent);
    color: var(--accent);
  }

  .stepper-line {
    width: 12px;
    height: 2px;
    background: var(--border);
    flex-shrink: 0;
  }

  .stepper-step.completed + .stepper-step .stepper-line,
  .stepper-step.completed .stepper-line {
    background: var(--accent);
  }

  .stepper-step + .stepper-step::before { display: none; }

  /* Form Elements */
  .field {
    margin-bottom: 1.5rem;
  }

  label {
    display: block;
    font-size: 0.75rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-mid);
    margin-bottom: 0.5rem;
  }

  input[type="text"],
  textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--sans);
    font-size: 0.9rem;
    padding: 0.75rem 1rem;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus,
  textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  textarea {
    resize: vertical;
    min-height: 80px;
  }

  input::placeholder,
  textarea::placeholder {
    color: var(--text-dim);
  }

  /* Avatar area */
  .avatar-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 1.5rem;
  }

  .avatar-preview {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 3px dashed var(--border);
    overflow: hidden;
    position: relative;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, background 0.2s;
  }

  .avatar-preview.has-image {
    border-style: solid;
    border-color: var(--border);
  }

  .avatar-preview.dragover {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .avatar-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .avatar-placeholder {
    color: var(--text-dim);
    font-size: 0.8rem;
    text-align: center;
  }

  .avatar-placeholder span {
    display: block;
    font-size: 2rem;
    margin-bottom: 0.25rem;
  }

  .avatar-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.75rem;
  }

  .btn-sm {
    font-family: var(--sans);
    font-size: 0.75rem;
    font-weight: 500;
    padding: 0.4rem 0.85rem;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-sm:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-sm:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Radio group */
  .radio-group {
    display: flex;
    gap: 0.5rem;
  }

  .radio-option {
    flex: 1;
  }

  .radio-option input {
    display: none;
  }

  .radio-option label {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.6rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.15s;
  }

  .radio-option input:checked + label {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }

  .radio-option label:hover {
    border-color: var(--border-focus);
  }

  /* Name field with status */
  .name-wrapper {
    position: relative;
  }

  .name-status {
    position: absolute;
    right: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.75rem;
    font-weight: 500;
  }

  .name-status.checking { color: var(--text-dim); }
  .name-status.available { color: var(--accent); }
  .name-status.taken { color: var(--error); }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-family: var(--sans);
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.75rem 1.5rem;
    border-radius: 100px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
  }

  .btn-primary {
    background: var(--accent);
    color: #1a1a2e;
  }

  .btn-primary:hover {
    filter: brightness(1.08);
    box-shadow: 0 4px 20px rgba(254, 202, 87, 0.25);
  }

  .btn-primary:disabled {
    background: var(--accent-dim);
    color: var(--text-dim);
    cursor: not-allowed;
    box-shadow: none;
    filter: none;
  }

  .btn-full {
    width: 100%;
  }

  /* Steps */
  .step {
    display: none;
    animation: fadeIn 0.3s ease;
  }

  .step.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Error */
  .error {
    font-size: 0.8rem;
    color: var(--error);
    margin-top: 0.5rem;
    text-align: center;
  }

  /* Spinner */
  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid transparent;
    border-top-color: currentColor;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Placeholder step */
  .placeholder-step {
    text-align: center;
    padding: 3rem 1rem;
  }

  .placeholder-step .icon {
    font-size: 2.5rem;
    margin-bottom: 1rem;
  }

  .placeholder-step h2 {
    font-weight: 600;
    font-size: 1.25rem;
    margin-bottom: 0.5rem;
  }

  .placeholder-step p {
    font-size: 0.875rem;
    color: var(--text-dim);
  }

  /* Hidden file input */
  .hidden-input {
    display: none;
  }

  /* Landing divider */
  .landing-divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 1.5rem 0;
    color: var(--text-dim);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .landing-divider::before,
  .landing-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* In-progress list */
  .in-progress-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .in-progress-card {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.75rem 1rem;
    cursor: pointer;
    transition: border-color 0.15s;
    text-decoration: none;
    color: inherit;
  }

  .in-progress-card:hover {
    border-color: var(--accent);
  }

  .in-progress-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--border);
    overflow: hidden;
    flex-shrink: 0;
  }

  .in-progress-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .in-progress-info {
    flex: 1;
    min-width: 0;
  }

  .in-progress-name {
    font-weight: 600;
    font-size: 0.9rem;
  }

  .in-progress-meta {
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .in-progress-arrow {
    color: var(--text-dim);
    font-size: 1.1rem;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>New <span class="highlight">Employee</span></h1>
    <p>12-step agent setup wizard</p>
  </div>

  <!-- Stepper -->
  <div class="stepper" id="stepper"></div>

  <!-- Landing -->
  <div id="step-landing" class="step active">
    <button class="btn btn-primary btn-full" id="start-btn">
      Start New Employee
    </button>
    <div id="in-progress-section" style="display: none;">
      <div class="landing-divider">or continue</div>
      <div class="in-progress-list" id="in-progress-list"></div>
    </div>
  </div>

  <!-- Step 1: Identity -->
  <div id="step-identity" class="step">
    <div class="avatar-area">
      <div class="avatar-preview" id="avatar-preview">
        <div class="avatar-placeholder" id="avatar-placeholder">
          <span>+</span>
          Avatar
        </div>
      </div>
      <div class="avatar-actions">
        <button class="btn-sm" id="regenerate-btn">Re-generate</button>
        <button class="btn-sm" id="upload-btn">Upload</button>
      </div>
      <input type="file" id="file-input" class="hidden-input" accept="image/*">
    </div>

    <div class="field">
      <label for="name">Name</label>
      <div class="name-wrapper">
        <input type="text" id="name" placeholder="Agent name" required>
        <span class="name-status" id="name-status"></span>
      </div>
    </div>

    <div class="field">
      <label for="personality">Personality</label>
      <textarea id="personality" placeholder="e.g. 🎨 Creative and strategic"></textarea>
    </div>

    <div class="field">
      <label>Gender</label>
      <div class="radio-group" id="gender-group">
        <div class="radio-option">
          <input type="radio" name="gender" id="gender-male" value="male">
          <label for="gender-male">Male</label>
        </div>
        <div class="radio-option">
          <input type="radio" name="gender" id="gender-female" value="female">
          <label for="gender-female">Female</label>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Tier</label>
      <div class="radio-group">
        <div class="radio-option">
          <input type="radio" name="tier" id="tier-junior" value="junior" checked>
          <label for="tier-junior">Junior</label>
        </div>
        <div class="radio-option">
          <input type="radio" name="tier" id="tier-senior" value="senior">
          <label for="tier-senior">Senior</label>
        </div>
        <div class="radio-option">
          <input type="radio" name="tier" id="tier-director" value="director">
          <label for="tier-director">Director</label>
        </div>
      </div>
    </div>

    <button class="btn btn-primary btn-full" id="next-btn" disabled>
      Next Step &rarr;
    </button>
    <div id="form-error" class="error"></div>
  </div>

  <!-- Step 2: Gmail -->
  <div id="step-gmail" class="step">
    <div class="placeholder-step" id="gmail-loading" style="padding-bottom: 1rem;">
      <div class="icon">&#9993;</div>
      <h2>Gmail Setup</h2>
      <p>Checking email availability...</p>
      <div style="margin-top: 1rem; display: flex; justify-content: center;"><div class="spinner"></div></div>
    </div>

    <div id="gmail-ready" style="display: none;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">&#9993;</div>
        <h2 style="font-weight: 600; font-size: 1.25rem; margin-bottom: 0.25rem;">Gmail Setup</h2>
        <p style="font-size: 0.875rem; color: var(--text-dim);">Create a workspace email for this employee</p>
      </div>

      <div class="field">
        <label>Email address</label>
        <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; font-size: 0.9rem; color: var(--accent);" id="email-display"></div>
      </div>

      <button class="btn btn-primary btn-full" id="create-email-btn">
        Create Email &amp; Continue &rarr;
      </button>
      <div id="email-error" class="error"></div>
    </div>

    <div id="gmail-done" style="display: none;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">&#9989;</div>
        <h2 style="font-weight: 600; font-size: 1.25rem; margin-bottom: 0.25rem;">Email Created</h2>
        <p style="font-size: 0.9rem; color: var(--accent); margin-top: 0.5rem;" id="email-created-display"></p>
      </div>
    </div>
  </div>

  <!-- Step 3: Placeholder -->
  <div id="step-3-placeholder" class="step">
    <div class="placeholder-step">
      <div class="icon">&#9729;</div>
      <h2>Step 3: Google Cloud</h2>
      <p>Coming soon</p>
    </div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // Fetch public config from server (env-driven, not hardcoded)
  const config = await fetch('/api/config').then((r) => r.json());
  const supabase = createClient(config.supabaseUrl, config.supabaseAnonKey);

  const STEP_LABELS = [
    'Identity', 'Gmail', 'Google Cloud', 'Phone Login', 'WhatsApp',
    'AI Account', 'Slack', 'Discord', 'Gateway', 'Config', 'WhatsApp GW', 'Ready'
  ];

  // State
  const state = {
    setupId: null,
    imageBase64: null,
    imageIsAiGenerated: true,
    nameAvailable: null,
    currentStep: 0,
  };

  // Build stepper
  function buildStepper(activeIndex) {
    const stepper = document.getElementById('stepper');
    stepper.innerHTML = '';
    STEP_LABELS.forEach((label, i) => {
      if (i > 0) {
        const line = document.createElement('div');
        line.className = 'stepper-line';
        stepper.appendChild(line);
      }
      const step = document.createElement('div');
      step.className = 'stepper-step';
      if (i < activeIndex) step.classList.add('completed');
      if (i === activeIndex) step.classList.add('active');
      step.innerHTML = `<div class="stepper-dot">${i + 1}<span class="stepper-tooltip">${label}</span></div>`;
      stepper.appendChild(step);
    });
  }

  buildStepper(-1); // No step active initially

  // Load in-progress setups
  async function loadInProgress() {
    const { data } = await supabase
      .from('agent_setups')
      .select('id, name, avatar_url, current_step, tier')
      .eq('status', 'in_progress')
      .order('updated_at', { ascending: false });

    if (!data || data.length === 0) return;

    const section = document.getElementById('in-progress-section');
    const list = document.getElementById('in-progress-list');
    section.style.display = '';

    list.innerHTML = data.map((setup) => `
      <div class="in-progress-card" data-id="${setup.id}" data-step="${setup.current_step}">
        <div class="in-progress-avatar">
          ${setup.avatar_url ? `<img src="${setup.avatar_url}" alt="${setup.name}">` : ''}
        </div>
        <div class="in-progress-info">
          <div class="in-progress-name">${setup.name}</div>
          <div class="in-progress-meta">Step ${setup.current_step} of 12 &middot; ${STEP_LABELS[setup.current_step - 1] || ''}</div>
        </div>
        <div class="in-progress-arrow">&rarr;</div>
      </div>
    `).join('');

    // Click handler for continue cards
    list.querySelectorAll('.in-progress-card').forEach((card) => {
      card.addEventListener('click', () => {
        const setupId = card.dataset.id;
        const step = parseInt(card.dataset.step, 10);
        continueSetup(setupId, step);
      });
    });
  }

  loadInProgress();

  // Image resize (reused from index.html pattern)
  function resizeImage(file, maxBytes = 2 * 1024 * 1024) {
    return new Promise((resolve) => {
      if (file.size <= maxBytes) { resolve(file); return; }
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let { width, height } = img;
        const scale = Math.sqrt(maxBytes / file.size) * 0.9;
        width = Math.round(width * scale);
        height = Math.round(height * scale);
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => resolve(new File([blob], file.name, { type: 'image/png' })), 'image/png', 0.85);
      };
      img.src = URL.createObjectURL(file);
    });
  }

  function fileToBase64(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.readAsDataURL(file);
    });
  }

  // Show image in preview
  function showImage(base64) {
    const preview = document.getElementById('avatar-preview');
    const placeholder = document.getElementById('avatar-placeholder');
    let img = preview.querySelector('img');
    if (!img) {
      img = document.createElement('img');
      preview.appendChild(img);
    }
    img.src = `data:image/png;base64,${base64}`;
    placeholder.style.display = 'none';
    preview.classList.add('has-image');
  }

  function clearImage() {
    const preview = document.getElementById('avatar-preview');
    const placeholder = document.getElementById('avatar-placeholder');
    const img = preview.querySelector('img');
    if (img) img.remove();
    placeholder.style.display = '';
    preview.classList.remove('has-image');
    state.imageBase64 = null;
  }

  // Debounced name check
  let nameTimer = null;
  function checkName(name) {
    const status = document.getElementById('name-status');
    const nextBtn = document.getElementById('next-btn');
    clearTimeout(nameTimer);

    if (!name.trim()) {
      status.textContent = '';
      status.className = 'name-status';
      state.nameAvailable = null;
      nextBtn.disabled = true;
      return;
    }

    status.textContent = '...';
    status.className = 'name-status checking';

    nameTimer = setTimeout(async () => {
      try {
        const [empRes, setupRes] = await Promise.all([
          supabase.from('employees').select('name').ilike('name', name.trim()),
          supabase.from('agent_setups').select('name').ilike('name', name.trim()).eq('status', 'in_progress'),
        ]);

        const taken = (empRes.data?.length || 0) > 0 || (setupRes.data?.length || 0) > 0;
        state.nameAvailable = !taken;

        if (taken) {
          status.textContent = 'taken';
          status.className = 'name-status taken';
          nextBtn.disabled = true;
        } else {
          status.textContent = 'available';
          status.className = 'name-status available';
          nextBtn.disabled = false;
        }
      } catch {
        status.textContent = '';
        status.className = 'name-status';
      }
    }, 300);
  }

  document.getElementById('name').addEventListener('input', (e) => checkName(e.target.value));

  // Start button — generate identity
  document.getElementById('start-btn').addEventListener('click', async () => {
    const btn = document.getElementById('start-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> Generating...';

    try {
      const res = await fetch('/api/agents/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Generation failed');

      // Fill form
      document.getElementById('name').value = data.name || '';
      document.getElementById('personality').value = data.personality || '';
      document.getElementById(`gender-${data.gender}`).checked = true;
      document.getElementById('tier-junior').checked = true;

      // Show image
      if (data.image) {
        state.imageBase64 = data.image;
        state.imageIsAiGenerated = true;
        showImage(data.image);
      }

      // Transition to step 1
      buildStepper(0);
      document.getElementById('step-landing').classList.remove('active');
      document.getElementById('step-identity').classList.add('active');
      state.currentStep = 1;

      // Trigger name check
      checkName(data.name);
    } catch (error) {
      btn.disabled = false;
      btn.textContent = 'Start Employee Creation';
      alert(error.message);
    }
  });

  // Gender change — clear AI-generated image
  document.querySelectorAll('input[name="gender"]').forEach((radio) => {
    radio.addEventListener('change', () => {
      if (state.imageIsAiGenerated) {
        clearImage();
      }
    });
  });

  // Re-generate button
  document.getElementById('regenerate-btn').addEventListener('click', async () => {
    const btn = document.getElementById('regenerate-btn');
    btn.disabled = true;
    btn.textContent = '...';

    try {
      const gender = document.querySelector('input[name="gender"]:checked')?.value;
      const res = await fetch('/api/agents/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gender, regenerateImageOnly: true }),
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      if (data.image) {
        state.imageBase64 = data.image;
        state.imageIsAiGenerated = true;
        showImage(data.image);
      }
    } catch (error) {
      console.error('Regenerate failed:', error);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Re-generate';
    }
  });

  // Upload button
  document.getElementById('upload-btn').addEventListener('click', () => {
    document.getElementById('file-input').click();
  });

  document.getElementById('file-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || !file.type.startsWith('image/')) return;
    const resized = await resizeImage(file);
    const base64 = await fileToBase64(resized);
    state.imageBase64 = base64;
    state.imageIsAiGenerated = false;
    showImage(base64);
  });

  // Drag and drop on avatar
  const avatarPreview = document.getElementById('avatar-preview');
  avatarPreview.addEventListener('dragover', (e) => { e.preventDefault(); avatarPreview.classList.add('dragover'); });
  avatarPreview.addEventListener('dragleave', () => avatarPreview.classList.remove('dragover'));
  avatarPreview.addEventListener('drop', async (e) => {
    e.preventDefault();
    avatarPreview.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (!file || !file.type.startsWith('image/')) return;
    const resized = await resizeImage(file);
    const base64 = await fileToBase64(resized);
    state.imageBase64 = base64;
    state.imageIsAiGenerated = false;
    showImage(base64);
  });

  // Next Step button
  document.getElementById('next-btn').addEventListener('click', async () => {
    const btn = document.getElementById('next-btn');
    const err = document.getElementById('form-error');
    err.textContent = '';

    const name = document.getElementById('name').value.trim();
    const personality = document.getElementById('personality').value.trim();
    const gender = document.querySelector('input[name="gender"]:checked')?.value;
    const tier = document.querySelector('input[name="tier"]:checked')?.value;

    if (!name || !personality || !gender || !tier) {
      err.textContent = 'All fields are required';
      return;
    }

    if (!state.nameAvailable) {
      err.textContent = 'Name is not available';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> Saving...';

    try {
      const res = await fetch('/api/agents/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name,
          personality,
          gender,
          tier,
          image: state.imageBase64,
        }),
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to save');

      state.setupId = data.setupId;

      // Transition to step 2 (Gmail)
      showGmailStep();
    } catch (error) {
      err.textContent = error.message;
      btn.disabled = false;
      btn.innerHTML = 'Next Step &rarr;';
    }
  });

  // === Step 2: Gmail ===

  async function showGmailStep() {
    buildStepper(1);
    document.querySelectorAll('.step.active').forEach((s) => s.classList.remove('active'));
    document.getElementById('step-gmail').classList.add('active');
    state.currentStep = 2;

    // Fetch setup data for the suggested email
    const { data: setup } = await supabase
      .from('agent_setups')
      .select('name, step_data')
      .eq('id', state.setupId)
      .single();

    // If email already created, show done state
    if (setup?.step_data?.email) {
      document.getElementById('gmail-loading').style.display = 'none';
      document.getElementById('gmail-ready').style.display = 'none';
      document.getElementById('gmail-done').style.display = '';
      document.getElementById('email-created-display').textContent = setup.step_data.email;
      // Auto-advance after a moment
      setTimeout(() => {
        buildStepper(2);
        document.getElementById('step-gmail').classList.remove('active');
        document.getElementById('step-3-placeholder').classList.add('active');
        state.currentStep = 3;
      }, 1500);
      return;
    }

    const name = setup?.name || 'agent';
    const baseName = name.toLowerCase().replace(/[^a-z0-9]/g, '');
    const suggestedEmail = `${baseName}@saint.work`;

    document.getElementById('email-display').textContent = suggestedEmail;
    document.getElementById('gmail-loading').style.display = 'none';
    document.getElementById('gmail-ready').style.display = '';
  }

  // Create email button
  document.getElementById('create-email-btn').addEventListener('click', async () => {
    const btn = document.getElementById('create-email-btn');
    const err = document.getElementById('email-error');
    err.textContent = '';
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> Creating...';

    try {
      const res = await fetch('/api/agents/create-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ setupId: state.setupId }),
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to create email');

      // Show success
      document.getElementById('gmail-ready').style.display = 'none';
      document.getElementById('gmail-done').style.display = '';
      document.getElementById('email-created-display').textContent = data.email;

      // Advance to step 3 after a moment
      setTimeout(() => {
        buildStepper(2);
        document.getElementById('step-gmail').classList.remove('active');
        document.getElementById('step-3-placeholder').classList.add('active');
        state.currentStep = 3;
      }, 2000);
    } catch (error) {
      err.textContent = error.message;
      btn.disabled = false;
      btn.innerHTML = 'Create Email &amp; Continue &rarr;';
    }
  });

  // Update continue handler for in-progress cards
  function continueSetup(setupId, step) {
    state.setupId = setupId;
    document.getElementById('step-landing').classList.remove('active');
    if (step === 1) {
      showGmailStep();
    } else if (step >= 2) {
      buildStepper(step);
      document.getElementById('step-3-placeholder').classList.add('active');
      state.currentStep = step + 1;
    }
  }
</script>

</body>
</html>
